[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-diagram"
version = "0.6.2"
description = "Python building blocks for dense architecture diagrams that check their own layout"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luke Deasy" }]
requires-python = ">=3.10"
dependencies = ["fonttools>=4.40", "mcp>=2.3,<3"]
keywords = ["diagram", "svg", "architecture", "agents", "visualization", "mcp", "mcp-server", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
png = ["pillow>=9"]
# The MCP toolkit is part of the main install since 0.6.2. The empty extra keeps old install lines such as
# `uvx --from "open-diagram[mcp]" open-diagram-mcp` working.
mcp = []

[project.scripts]
open-diagram = "open_diagram.cli:run"
open-diagram-mcp = "open_diagram.mcp_server:main"

[project.urls]
Homepage = "https://open-diagram.dev"
Source = "https://github.com/lukendeasy/open-diagram"

[tool.setuptools]
# The repository's templates/ folder ships inside the package as open_diagram/templates, so `open-diagram new` and
# the MCP server's template tool work after pip install.
packages = ["open_diagram", "open_diagram.templates"]
package-dir = {"" = "src", "open_diagram.templates" = "templates"}

[tool.setuptools.package-data]
open_diagram = ["fonts/*.ttf", "fonts/*.txt"]
"open_diagram.templates" = ["*.json", "*.mmd", "README.md", "assets/README.md", "assets/*/*"]
